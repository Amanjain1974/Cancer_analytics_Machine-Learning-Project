{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width:550px;">
    <h2 class="text-center mb-4">Create Account</h2>

    <div class="alert alert-info">

    </div>
</div>
{% endblock %}
